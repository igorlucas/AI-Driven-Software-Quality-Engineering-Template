image: python:3.11

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - quality

framework-quality:
  stage: quality
  script:
    - python automation/run_quality_checks.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/generated/
