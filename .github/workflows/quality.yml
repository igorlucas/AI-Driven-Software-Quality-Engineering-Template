name: Framework quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Validate lifecycle traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run framework quality checks
        run: python automation/run_quality_checks.py
      - name: Archive validation report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-validation
          path: reports/generated/
          if-no-files-found: warn
          retention-days: 30
